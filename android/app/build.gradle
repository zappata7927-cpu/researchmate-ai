plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.behbehan.researchmate'
    compileSdk 35

    signingConfigs {
        // Use the machine's debug keystore so the release APK stays installable
        // without shipping any real signing credentials. On a fresh machine the
        // Android Gradle Plugin auto-generates this keystore automatically.
        releaseSigning {
            def debugKeystore = new File(System.getProperty("user.home"), ".android/debug.keystore")
            if (debugKeystore.exists()) {
                storeFile debugKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    defaultConfig {
        applicationId 'ir.behbehan.researchmate'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def debugKeystore = new File(System.getProperty("user.home"), ".android/debug.keystore")
            if (debugKeystore.exists()) signingConfig signingConfigs.releaseSigning
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
