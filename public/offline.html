<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>آفلاین — پژوهش‌یار هوشمند</title>
    <style>
      body { font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; background: #f5f7fa; color: #0e2a47; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
      .card { background: #fff; border: 1px solid #dbe3ec; border-radius: 20px; padding: 40px 32px; max-width: 420px; text-align: center; box-shadow: 0 10px 30px rgba(14,42,71,.08); }
      .badge { display: inline-flex; align-items: center; gap: 8px; background: #e6f5f3; color: #0f766e; font-weight: 700; font-size: 13px; border-radius: 999px; padding: 6px 14px; margin-bottom: 18px; }
      h1 { font-size: 20px; margin: 0 0 10px; }
      p { color: #475569; font-size: 14px; line-height: 1.9; margin: 0 0 18px; }
      button { background: #0f766e; color: #fff; border: 0; border-radius: 12px; padding: 10px 22px; font-weight: 700; font-size: 14px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">پژوهش‌یار هوشمند | ResearchMate AI</div>
      <h1>اتصال اینترنت در دسترس نیست</h1>
      <p>
        برای پردازش اسناد و داوری هوشمند، اتصال به سرور لازم است.
        لطفاً اتصال اینترنت خود را بررسی کنید و دوباره تلاش کنید.
      </p>
      <button onclick="location.reload()">تلاش دوباره</button>
    </div>
  </body>
</html>
